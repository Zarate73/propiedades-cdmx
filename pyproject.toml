[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propiedades-cdmx"
version = "1.0.0"
description = "Scraper concurrente de propiedades en CDMX (propiedades.com) + análisis de precios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "selenium>=4.20",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
analysis = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "geopandas>=0.14",
    "plotly>=5.20",
    "umap-learn>=0.5",
    "tensorflow>=2.16; platform_machine != 'x86_64' or platform_system != 'Darwin'",
    "jupyter>=1.0",
]

[project.scripts]
propiedades-cdmx = "propiedades_cdmx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
